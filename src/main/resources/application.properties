# Name of the Spring application (useful in logs, Eureka/Consul, etc.)
spring.application.name=QuizApp-Monolithic

# -------------------------------
# H2 In-Memory Database Settings
# -------------------------------

# JDBC URL for H2 in-memory database named "quiz-app"
spring.datasource.url=jdbc:h2:mem:quiz-app

# H2 driver class
spring.datasource.driverClassName=org.h2.Driver

# Default username for H2 (sa = system administrator)
spring.datasource.username=sa

# Default password (empty for in-memory H2)
spring.datasource.password=

# -------------------------------
# Hibernate / JPA Settings
# -------------------------------

# Show SQL statements in the console (useful for debugging)
spring.jpa.show-sql=true

# Schema update mode: create tables automatically or update them
# Options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Ensures that schema/data initialization happens after datasource is ready
spring.jpa.defer-datasource-initialization=true

# -------------------------------
# H2 Console Settings
# -------------------------------

# Enables the H2 database web console
spring.h2.console.enabled=true

# Path to access the H2 web console in browser
# Example: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console
